<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Launchpad course verification</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./content.js" defer></script>
  <script src="./curriculum.js" defer></script>
  <script src="./planner.js" defer></script>
</head>
<body>
  <main>
    <p><a href="./index.html#backup">← Return to academy</a></p>
    <h1>Course and planner checks</h1>
    <section class="card">
      <p>These checks do not modify saved learning records or run Python.</p>
      <button id="run" class="primary" type="button">Run checks</button>
      <p id="summary" role="status">Not run yet.</p>
      <ol id="results"></ol>
    </section>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const button = document.getElementById("run");
      const summary = document.getElementById("summary");
      const output = document.getElementById("results");

      button.addEventListener("click", () => {
        output.replaceChildren();
        const results = [];
        const assert = (value, message) => {
          if (!value) throw new Error(message);
        };
        const test = (name, callback) => {
          try {
            callback();
            results.push({ name, pass: true });
          } catch (error) {
            results.push({ name, pass: false, error: String(error.message || error) });
          }
        };

        try {
          const P = window.Planner;
          const C = window.COURSE;
          if (!P?.restore || C?.catalogVersion !== 2) {
            throw new Error("Load the matching content.js, curriculum.js, and planner.js files.");
          }
          const all = P.tasks(C.lessons);
          const profile = {
            os: "windows", experience: "new", goal: "personal",
            start: "2026-09-28", minutes: 30, days: [1, 3, 5]
          };

          test("There are 21 unique delivered lessons", () => {
            assert(C.lessons.length === 21, "Unexpected lesson count.");
            assert(new Set(C.lessons.map(l => l.id)).size === 21, "Duplicate lesson IDs.");
          });

          test("Every MCQ has four options and four explanations", () => {
            for (const lesson of C.lessons) {
              assert(lesson.quiz.length > 0, "Missing quiz.");
              for (const q of lesson.quiz) {
                assert(q.options.length === 4, "Not four choices.");
                assert(q.explanations.length === 4, "Missing option explanation.");
                assert(Number.isInteger(q.answer) && q.answer >= 0 && q.answer < 4, "Invalid answer.");
              }
            }
          });

          test("All prerequisites refer to earlier delivered lessons", () => {
            C.lessons.forEach((lesson, index) => {
              for (const id of lesson.requires || []) {
                const earlier = C.lessons.findIndex(l => l.id === id);
                assert(earlier >= 0 && earlier < index, "Invalid prerequisite order.");
              }
            });
          });

          test("Variable estimates create matching activity minutes", () => {
            const minutes = C.lessons.reduce((sum, l) =>
              sum + l.duration.reduce((a, b) => a + b, 0), 0);
            assert(all.length * 15 === minutes, "Duration mismatch.");
            assert(new Set(all.map(t => t.id)).size === all.length, "Duplicate task IDs.");
          });

          test("Schedule respects selected days and daily capacity", () => {
            const plan = P.schedule(all, profile, {}, profile.start);
            const counts = {};
            for (const task of all) {
              const day = plan[task.id];
              assert(profile.days.includes(P.date(day).getUTCDay()), "Wrong weekday.");
              counts[day] = (counts[day] || 0) + task.minutes;
            }
            assert(Object.values(counts).every(n => n <= 30), "Daily capacity exceeded.");
          });

          test("Schedule preserves activity ordering", () => {
            const plan = P.schedule(all, profile, {}, profile.start);
            for (let i = 1; i < all.length; i++) {
              assert(plan[all[i].id] >= plan[all[i - 1].id], "Activities reordered.");
            }
          });

          test("Completed work survives catch-up scheduling", () => {
            const done = { [all[0].id]: "2026-09-28" };
            const plan = P.schedule(all, profile, done, "2026-10-05");
            assert(plan[all[0].id] === "2026-09-28", "Completed date changed.");
            assert(plan[all[1].id] >= "2026-10-05", "Pending work left behind.");
          });

          test("Migration preserves notes but does not invent quiz passes", () => {
            const old = {
              schema: 1, profile, theme: "dark", last: "computer-map",
              done: { "computer-map:learn": "2026-09-28", "computer-map:check": "2026-09-28" },
              work: { "computer-map": { notes: "Keep me", draft: "My draft", evidence: "My observation", answer: 1 } }
            };
            const migrated = P.migrate(old, C.lessons, "2026-10-05");
            assert(migrated.work["computer-map"].notes === "Keep me", "Notes lost.");
            assert(migrated.work["computer-map"].legacyEvidence === "My observation", "Observation lost.");
            assert(migrated.work["computer-map"].attempts.length === 0, "Invented quiz attempt.");
            assert(migrated.done["computer-map:learn:1"], "Reading completion lost.");
            assert(!migrated.done["computer-map:quiz:1"], "Invented quiz pass.");
            P.validate(migrated, C.lessons);
          });

          test("Backup validation rejects fabricated quiz completion", () => {
            const state = P.empty();
            state.profile = profile;
            state.plan = P.schedule(all, profile, {}, profile.start);
            state.done["computer-map:quiz:1"] = profile.start;
            let rejected = false;
            try { P.validate(state, C.lessons); } catch { rejected = true; }
            assert(rejected, "Quiz completion accepted without passing attempt.");
          });

          test("Quiz scoring uses the actual answer key", () => {
            const lesson = C.lessons.find(l => l.id === "report-html");
            assert(P.score(lesson, lesson.quiz.map(q => q.answer)) === 100, "Perfect answer set not recognized.");
            assert(P.score(lesson, lesson.quiz.map(q => (q.answer + 1) % 4)) === 0, "Wrong answers scored as correct.");
          });

          test("Calendar excludes completed blocks", () => {
            const subset = all.slice(0, 2);
            const plan = P.schedule(subset, profile, {}, profile.start);
            const text = P.calendar(subset, plan, { [subset[0].id]: profile.start });
            assert((text.match(/BEGIN:VEVENT/g) || []).length === 1, "Incorrect event count.");
            assert(text.includes("DTEND;VALUE=DATE:20260929"), "Incorrect all-day end.");
          });

          test("Invalid dates and empty study-day selections are rejected", () => {
            let dateRejected = false, daysRejected = false;
            try { P.date("2026-02-30"); } catch { dateRejected = true; }
            try { P.profile({ ...profile, days: [] }); } catch { daysRejected = true; }
            assert(dateRejected && daysRejected, "Invalid input accepted.");
          });

          for (const result of results) {
            const item = document.createElement("li");
            item.textContent = (result.pass ? "PASS — " : "FAIL — ") +
              result.name + (result.error ? ": " + result.error : "");
            output.append(item);
          }
          summary.textContent = `${results.filter(r => r.pass).length}/${results.length} checks passed in this browser.`;
        } catch (error) {
          summary.textContent = "Checks could not run: " + String(error.message || error);
        }
      });
    });
  </script>
</body>
</html>
